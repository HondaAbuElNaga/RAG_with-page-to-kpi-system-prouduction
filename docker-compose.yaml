services:
  rag-app:
    image: ebrahemhesham/rag-app:${TAG:-v3}
    build:
      context: ./image
      dockerfile: dockerfile

    container_name: rag-app

    ports:
      # 8080 is taken by National Instruments' ApplicationWebServer on this machine.
      - "8081:80"
    env_file:
      - ./image/.env
    environment:
      # Paths must match the ECS task definition so local Docker reproduces
      # production exactly. In ECS, /mnt/efs is the EFS volume mount point.
      - DB_PATH=/mnt/efs/kpi_data.db
      - CHROMA_PATH=/mnt/efs/chroma_db

    volumes:
      # EFS volume: this host folder appears at /mnt/efs
      # inside the container, the same path ECS mounts EFS at.
      - ./image/src/rag_app/data:/mnt/efs
      # Optional: Mount .env file if needed (uncomment if you want to override)
      # - ./image/.env:/app/.env:ro
    restart: unless-stopped
    healthcheck:
      # python:3.12-slim ships no curl — use the interpreter that is present.
      # Hits /health rather than /, which renders the full chat page.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:80/health', timeout=5).status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
