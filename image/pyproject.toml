[project]
name = "image"
version = "0.1.0"
description = "RAG System"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Web framework / server
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.1",
    "python-multipart==0.0.20",
    "Jinja2==3.1.6",
    "starlette==0.46.2",
    # Data / config
    "SQLAlchemy==2.0.40",
    "pydantic==2.11.3",
    "python-dotenv==1.1.0",
    # RAG stack
    "langchain-chroma==0.2.3",
    "langchain-community==0.3.21",
    "langchain-openai==0.3.12",
    "langchain-text-splitters==0.3.8",
    "chromadb==0.6.3",
    "pypdf==5.4.0",
    # AWS
    "boto3>=1.43.63",
    "botocore[crt]>=1.43.63",
]

[dependency-groups]
dev = [
    "ruff==0.11.5",
]
test = [
    "pytest>=8.3.5",
    "pytest-asyncio>=0.26.0",
    "httpx==0.28.1",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
